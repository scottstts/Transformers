    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Transformer",
        "url": "https://transformer.scottsun.io",
        "image": "https://transformer.scottsun.io/og_image.png",

        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Desktop Chromium browser with WebGPU",
        "playMode": "SinglePlayer",

        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }

  <body>
    <div id="app"></div>
    <div class="veil" style="--progress: 0">
      <div class="veil-sky" aria-hidden="true">
        <div class="veil-sun"></div>
        <svg class="veil-ridges" viewBox="0 0 1440 320" preserveAspectRatio="none">
          <path class="veil-ridge-far" d="M0 196C110 176 196 146 318 154C432 162 478 116 596 106C706 97 770 146 884 138C1002 130 1078 84 1198 94C1310 104 1378 144 1440 154V320H0Z" />
          <path class="veil-ridge-near" d="M0 246C154 232 262 212 402 222C540 232 622 202 762 207C902 212 984 238 1122 230C1262 222 1358 206 1440 214V320H0Z" />
          <path class="veil-floor" d="M0 268H1440V320H0Z" />
        </svg>
      </div>
      <main class="entry">
        <h1 class="entry-mark" aria-label="Transformer">
          <span aria-hidden="true" style="--i: 0">T</span><span aria-hidden="true" style="--i: 1">R</span><span aria-hidden="true" style="--i: 2">A</span><span aria-hidden="true" style="--i: 3">N</span><span aria-hidden="true" style="--i: 4">S</span><span aria-hidden="true" style="--i: 5">F</span><span aria-hidden="true" style="--i: 6">O</span><span aria-hidden="true" style="--i: 7">R</span><span aria-hidden="true" style="--i: 8">M</span><span aria-hidden="true" style="--i: 9">E</span><span aria-hidden="true" style="--i: 10">R</span>
        </h1>
        <p class="entry-line">Cars that stand up and walk</p>
        <div class="entry-deck">
          <div class="entry-gauge" aria-hidden="true"><span class="entry-gauge-fill"></span><span class="entry-gauge-mark"></span></div>
          <button class="entry-button" id="entry-button" type="button" hidden>
            <span class="entry-button-label">Enter</span>
            <svg viewBox="0 0 24 12" aria-hidden="true"><path d="M1 6h20M16 1l5 5-5 5" /></svg>
          </button>
        </div>
        <p class="entry-stage" role="status" aria-live="polite"><span class="entry-count" id="boot-count">00/07</span><span id="boot-status">Loading assets</span></p>
        <p class="entry-keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move <i></i><kbd>Shift</kbd> drift <i></i><kbd>Space</kbd> jump <i></i><kbd>R</kbd> transform <i></i><kbd>F</kbd> special <i></i><kbd>Tab</kbd> vehicles</p>
        <p class="entry-unsupported" id="unsupported-message" role="status" hidden>Please visit on a desktop Chromium browser for a better experience.</p>
        <div class="entry-error" id="boot-error" role="alert" hidden></div>
        <noscript><p class="entry-error">Transformer needs JavaScript and a desktop Chromium browser with WebGPU.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
